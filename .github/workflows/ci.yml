name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same branch rather than queueing them.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Format, lint, typecheck, test, build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # node:sqlite needs 22.5+; 24 is what the project is developed on.
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Bundle the Cloudflare Worker
        run: npx wrangler deploy --dry-run

      - name: Check the icon set is reproducible
        # The icons are generated from a script; regenerating them must not
        # produce a diff, so committed binaries always match their source.
        run: |
          npm run generate:icons --workspace @octoprice/web
          git diff --exit-code -- apps/web/public/icons
